events {}

http {
    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name velunisbank.com api.velunisbank.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Frontend
    server {
        listen 443 ssl;
        server_name velunisbank.com;

        ssl_certificate /etc/letsencrypt/live/velunisbank.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/velunisbank.com/privkey.pem;

        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Backend API
    server {
        listen 443 ssl;
        server_name api.velunisbank.com;

        ssl_certificate /etc/letsencrypt/live/api.velunisbank.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.velunisbank.com/privkey.pem;

        location / {
            proxy_pass http://backend:4000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}