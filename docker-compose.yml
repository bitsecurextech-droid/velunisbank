version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: velunis
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: velunis
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - velunis

  backend:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: postgresql://velunis:${DB_PASSWORD}@db:5432/velunis
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FRONTEND_URL: https://velunisbank.com
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    depends_on:
      - db
    networks:
      - velunis

  frontend:
    build: ./frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: https://api.velunisbank.com
    depends_on:
      - backend
    networks:
      - velunis

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - velunis

networks:
  velunis:

volumes:
  pgdata: